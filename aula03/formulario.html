<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="formulario.html">Formulário</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Formulário</h1>

        <form action="exibirdados.html" method="get">
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha" required><br><br>

            <label for="radiolang">Selecione uma linguagem:</label><br>
            <input type="radio" id="html" name="linguagem" value="HTML">
            <label for="html">HTML qualquer coisa</label><br>
            <input type="radio" id="js" name="linguagem" value="JS">
            <label for="js">Javascript</label><br>
            <input type="radio" id="css" name="linguagem" value="CSS">
            <label for="css">CSS 3</label><br><br>

            <input type="submit" value="Cadastrar"> <br><br>
        </form>
    </main>

    <footer>
        <a href="https://pt.wikipedia.org/wiki/Clube_de_Regatas_do_Flamengo">Wikipedia</a> <br>
        <a href="https://www.flamengo.com.br/">Site oficial do Flamengo</a>
    </footer>
</body>
</html>
